spring.application.name=portofc-backend
server.port=8080

# Database Configuration (PostgreSQL Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/portofc_db
spring.datasource.username=portofc_user
spring.datasource.password=portofc_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# PORTO FC Application Settings
# Ative para carregar a massa completa de alunos, presencas, colaboradores, folha, financeiro e uniformes
app.seed.enabled=true

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
